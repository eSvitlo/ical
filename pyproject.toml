[project]
name = "yasno-outages-ical"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "aiocache>=0.12.3",
    "aiohttp>=3.14.4",
    "hypercorn>=0.18.0",
    "icalendar>=7.3.0",
    "playwright>=1.63.0",
    "pydantic>=2.14.0",
    "quart>=0.23.1",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]

[tool.ruff]
required-version = ">=0.16.10"

[tool.ruff.lint]
extend-select = ["I"]
